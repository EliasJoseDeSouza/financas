{% extends 'base.html' %}

{% block content %}

<div class="page-title">
  Novo Lançamento
  <span>{% if replicando %}Replicar lançamento — edite antes de salvar{% else %}Registrar uma receita ou despesa{% endif %}</span>
</div>

<div class="card">

  <form method="POST">

    <div class="form-grid">

      <!-- Tipo -->
      <div class="form-group">
        <label for="tipo">Tipo</label>
        <select name="tipo" id="tipo" required>
          <option value="Despesa" {% if prefill.tipo == 'Despesa' %}selected{% elif not prefill.tipo %}selected{% endif %}>Despesa</option>
          <option value="Receita" {% if prefill.tipo == 'Receita' %}selected{% endif %}>Receita</option>
        </select>
      </div>

      <!-- Competência -->
      <div class="form-group">
        <label for="competencia">Competência</label>
        <input
          type="text"
          name="competencia"
          id="competencia"
          placeholder="Ex: 06/2026"
          value="{{ prefill.competencia }}"
          required>
      </div>

      <!-- Descrição (ocupa linha inteira) -->
      <div class="form-group full">
        <label for="descricao">Descrição</label>
        <input
          type="text"
          name="descricao"
          id="descricao"
          placeholder="Ex: Salário, Aluguel, Supermercado..."
          value="{{ prefill.descricao }}"
          required>
      </div>

      <!-- Valor -->
      <div class="form-group">
        <label for="valor">Valor (R$)</label>
        <input
          type="number"
          step="0.01"
          name="valor"
          id="valor"
          placeholder="0,00"
          value="{{ prefill.valor }}"
          required>
      </div>

      <!-- Forma de pagamento -->
      <div class="form-group">
        <label for="forma_pagamento">Forma de Pagamento</label>
        <select name="forma_pagamento" id="forma_pagamento" required>
          <option value="" disabled {% if not prefill.forma_pagamento %}selected{% endif %}>Selecione...</option>
          {% for forma in formas_pagamento %}
          <option value="{{ forma }}" {% if prefill.forma_pagamento == forma %}selected{% endif %}>{{ forma }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Botão -->
      <div class="form-group full" style="margin-top: 6px;">
        <button type="submit" class="btn btn-primary">
          ✓ Salvar Lançamento
        </button>
      </div>

    </div>

  </form>

</div>

{% endblock %}
