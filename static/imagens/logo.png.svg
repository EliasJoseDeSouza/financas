<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <defs>
    <linearGradient id="gA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Icon mark: three stacked coins / chart bars -->
  <rect x="4" y="18" width="10" height="26" rx="3" fill="url(#gC)" opacity="0.9"/>
  <rect x="18" y="10" width="10" height="34" rx="3" fill="url(#gA)" opacity="0.9"/>
  <rect x="32" y="4" width="10" height="40" rx="3" fill="url(#gB)" opacity="0.9"/>

  <!-- Upward arrow accent -->
  <polyline points="4,44 14,30 24,36 44,10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <polygon points="44,10 38,14 42,18" fill="white" opacity="0.35"/>

  <!-- Text: Finanças -->
  <text x="56" y="28" font-family="'Syne', 'Arial Black', sans-serif" font-weight="800" font-size="18" fill="#e2e8f0" letter-spacing="-0.5">Finanças</text>
  <!-- Text: Família -->
  <text x="56" y="48" font-family="'DM Sans', 'Arial', sans-serif" font-weight="400" font-size="13" fill="#64748b" letter-spacing="2">FAMÍLIA</text>

  <!-- Accent line under Finanças -->
  <rect x="56" y="32" width="80" height="1.5" rx="1" fill="url(#gA)" opacity="0.4"/>
</svg>
