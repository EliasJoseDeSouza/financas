{% extends 'base.html' %}

{% block content %}

<div class="page-title">
  Editar Lançamento
  <span>Modificar registro #{{ item.id }}</span>
</div>

<div class="card">

  <form method="POST">

    <div class="form-grid">

      <div class="form-group">
        <label for="tipo">Tipo</label>
        <select name="tipo" id="tipo" required>
          <option value="Receita"   {% if item.tipo == 'Receita'  %}selected{% endif %}>Receita</option>
          <option value="Despesa"   {% if item.tipo == 'Despesa'  %}selected{% endif %}>Despesa</option>
        </select>
      </div>

      <div class="form-group">
        <label for="competencia">Competência</label>
        <input
          type="text"
          name="competencia"
          id="competencia"
          value="{{ item.competencia }}"
          required>
      </div>

      <div class="form-group full">
        <label for="descricao">Descrição</label>
        <input
          type="text"
          name="descricao"
          id="descricao"
          value="{{ item.descricao }}"
          required>
      </div>

      <div class="form-group">
        <label for="valor">Valor (R$)</label>
        <input
          type="number"
          step="0.01"
          name="valor"
          id="valor"
          value="{{ item.valor }}"
          required>
      </div>

      <div class="form-group">
        <label for="forma_pagamento">Forma de Pagamento</label>
        <input
          type="text"
          name="forma_pagamento"
          id="forma_pagamento"
          value="{{ item.forma_pagamento }}"
          required>
      </div>

      <div class="form-group full" style="margin-top: 6px;">
        <div style="display: flex; gap: 12px;">
          <button type="submit" class="btn btn-primary">✓ Salvar alterações</button>
          <a href="/relatorios" class="btn btn-secondary">Cancelar</a>
        </div>
      </div>

    </div>

  </form>

</div>

{% endblock %}
