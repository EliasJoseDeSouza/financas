<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- CSS principal -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

  <!-- ░░ FUNDO ░░
       A imagem fundo.png fica em static/imagens/fundo.png
       O div abaixo a exibe "resfolgada" (efeito vidro por cima) -->
  <div id="bg"></div>

  <!-- ░░ SIDEBAR (menu lateral) ░░ -->
  <nav id="sidebar">

    <div class="sidebar-logo">
      <img src="{{ url_for('static', filename='imagens/logo.png') }}" alt="Logo" class="sidebar-logo-img">
    </div>

    <a href="/" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
      <span class="nav-icon">📊</span> Dashboard
    </a>

    <a href="/lancamentos" class="nav-item {% if request.endpoint == 'lancamentos' %}active{% endif %}">
      <span class="nav-icon">➕</span> Lançamentos
    </a>

    <a href="/relatorios" class="nav-item {% if request.endpoint == 'relatorios' %}active{% endif %}">
      <span class="nav-icon">📋</span> Relatórios
    </a>

  </nav>

  <!-- ░░ BARRA SUPERIOR ░░ -->
  <div id="topbar">
    <button id="menu-btn" onclick="toggleMenu()">☰</button>
    <h2>Controle Financeiro dos Souza</h2>
  </div>

  <!-- ░░ CONTEÚDO DA PÁGINA ░░ -->
  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <!-- JS -->
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
